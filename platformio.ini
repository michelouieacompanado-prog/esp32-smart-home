; PlatformIO Project Configuration File for ESP32 Smart Home
; Two environments: plug and sensor

[platformio]
default_envs = plug, sensor

[env]
platform = espressif32 @ 6.6.0
framework = espidf
board = esp32dev
monitor_speed = 115200
board_build.partitions = partitions.csv

[env:plug]
board_build.cmake_extra_args = -DDEVICE=plug
build_flags =
    -DDEVICE=plug
    -DAPP_DEVICE_PLUG=1

[env:sensor]
board_build.cmake_extra_args = -DDEVICE=sensor
build_flags =
    -DDEVICE=sensor
    -DAPP_DEVICE_SENSOR=1
